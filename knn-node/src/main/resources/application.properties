# Unified HTTP + gRPC Configuration (single Vert.x server port)
quarkus.http.port=48100

# gRPC codegen: the v1alpha1 protos import google/rpc/status.proto, which lives in
# proto-google-common-protos (already on the classpath via grpc-protobuf). Extend the
# import scan so protoc can resolve it alongside protobuf's well-known types.
quarkus.generate-code.grpc.scan-for-imports=com.google.protobuf:protobuf-java,com.google.api.grpc:proto-google-common-protos
quarkus.grpc.server.use-separate-server=false
quarkus.grpc.server.health.enabled=true
quarkus.grpc.server.enable-reflection=true

# Shard Data (Environment Overrides)
knn.shard.id=0
knn.index.path=index/shard-0

# Benchmark harness (Environment Overrides)
# Pure mode: search uses exactly the caller's k — no internal K-scaling, no visit
# limit, no topology sketches. The collaborative floor stays toggleable per request.
knn.pure-mode=false
# Pre-built external Lucene index (e.g. from luceneutil KnnGraphTester). When set,
# all searches run against this read-only index instead of engine-built shards.
#knn.external-index-path=/path/to/index
knn.external-index-vector-field=knn
# TEMPORARY: peer gRPC channels run plaintext because the gRPC server has no TLS
# configuration yet (no quarkus.http.ssl certs; grpc rides the plain HTTP server).
# The client code defaults to TLS, so flip this to false the moment server certs
# are provisioned. Do NOT ship a multi-node deployment on an untrusted network
# while this is true.
knn.grpc.plaintext=true
# The coordinator currently does not consume topology sketches, so avoid their scoring overhead.
knn.topology-sketch.enabled=false

# Cross-encoder rerank head on the coordinator (disabled by default). When enabled,
# merged shard candidates with chunk text are rescored by a RerankProvider before
# top-k truncation; text searches only, raw-vector POST /search is never reranked.
knn.rerank.enabled=false
# Registered provider name (e.g. tei); unset picks the first provider supporting the model.
#knn.rerank.provider=tei
# Reranker model id passed to the provider's score call.
#knn.rerank.model=BAAI/bge-reranker-v2-m3

# DJL Serving (override with DJL_API_MP_REST_URL or quarkus profile)
djl-api/mp-rest/url=http://localhost:8091
knn.query.prefix=query: 

# ScaleCube Cluster (Override via environment)
knn.scalecube.port=4800
# No base seed is intentional. Configure knn.scalecube.seeds, or use the
# scalecube profile, to opt into cluster membership.

# Collection storage directory
knn.data.dir=data

# Stork Discovery
quarkus.stork.knn-peers.service-discovery.type=scalecube
quarkus.stork.knn-peers.service-discovery.grpc-port=48100
