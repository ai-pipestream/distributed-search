// ai.pipestream.search v1alpha1 -- public indexing surface.
//
// Bulk indexing is a bidirectional stream with per-document acks and
// credit-based flow control tied to the server's flush/merge pressure.
// See docs/rfc/SEARCH_API_V1.md for the backpressure protocol.

syntax = "proto3";

package ai.pipestream.search.v1alpha1;

import "google/protobuf/any.proto";
import "google/rpc/status.proto";
import "v1alpha1/common.proto";

option java_multiple_files = true;
option java_package = "ai.pipestream.search.v1alpha1";
option java_outer_classname = "IndexServiceProto";

service IndexService {
  // Bidirectional bulk indexing.
  //
  // Client sends: an optional leading BulkOptions frame, then IndexDocument
  // frames, with FlushMarker frames wherever durability confirmation is
  // needed.
  //
  // Server sends: a FlowControl frame first (initial credit grant), then a
  // DocAck per document (possibly out of order across shards), further
  // FlowControl frames as flush/merge pressure changes, and a FlushAck per
  // FlushMarker.
  //
  // Per-document failures are reported in DocAck.status and do NOT
  // terminate the stream. Only stream-level faults (unknown collection
  // with no per-doc override, auth, transport) end the RPC with an error.
  rpc BulkIndex (stream BulkIndexRequest) returns (stream BulkIndexResponse);

  // Fetches a document's stored fields by id.
  rpc GetDocument (GetDocumentRequest) returns (GetDocumentResponse);

  // Deletes a document by id.
  rpc DeleteDocument (DeleteDocumentRequest) returns (DeleteDocumentResponse);

  // Deletes every block of a parent across every shard (document-centric
  // collections). Idempotent: deleting an absent parent returns
  // blocks_deleted = 0 with OK. Also the repair primitive for a crashed
  // re-chunk and the compensating action for a partially-failed parent
  // write.
  rpc DeleteParentDocument (DeleteParentDocumentRequest)
      returns (DeleteParentDocumentResponse);
}

// One client->server frame of a BulkIndex stream.
message BulkIndexRequest {
  oneof frame {
    // Stream-level defaults. If present, must be the first frame.
    BulkOptions options = 1;
    IndexDocument document = 2;
    FlushMarker flush = 3;
    // Document-centric ingest: one parent fanning out to many chunks across
    // many shards. Acknowledged with ParentAck, never DocAck.
    IndexParentDocument parent_document = 4;
  }
}

// Stream-level defaults for a BulkIndex session.
message BulkOptions {
  // Default target collection for documents that leave `collection` empty.
  string collection = 1;
  // The schema the client compiled against. Must equal the collection pin,
  // or the stream fails FAILED_PRECONDITION on the FIRST document -- a stale
  // bulk load fails at frame 1, not at frame 900k.
  SchemaPin schema = 2;
  // Default policy for parents that leave `policy` unset.
  IndexPolicy default_policy = 3;
}

// A parent document indexed with shard-local block joins. Produces N chunk
// documents plus one parent stub per participating shard.
//
// Distinct from IndexDocument because IndexDocument's contract is
// upsert-of-one-Lucene-document-by-id, which cannot hold for a write that
// fans out across shards.
message IndexParentDocument {
  // Shares one sequence space with IndexDocument.client_seq.
  uint64 client_seq = 1;
  string collection = 2;
  // REQUIRED and client-stable. Unlike IndexDocument.doc_id, empty is
  // INVALID_ARGUMENT: delete-by-parent and idempotent replay both key on it.
  string doc_id = 3;
  // Asserted pin for the parent payload AND every chunk payload.
  // Unset = BulkOptions.schema; unset in both = the collection pin, echoed
  // in ParentAck.resolved_schema.
  SchemaPin schema = 4;
  // The parent, as the collection's pinned root message, in an Any.
  // Present in BOTH modes. Projected onto the parent stub (filter metadata
  // only -- the stub carries no vector).
  google.protobuf.Any payload = 5;

  oneof mode {
    ServerChunking server_chunking = 6;   // mode A
    SuppliedChunks supplied_chunks = 7;   // mode B
  }

  IndexPolicy policy = 8;
  // Monotonic generation, making the cross-shard purge order-independent.
  // 0 = server-assigned. Non-zero is for writers holding an authoritative
  // version (CDC LSN, event offset); a generation <= the last written for
  // this parent is ALREADY_EXISTS.
  uint64 generation = 9;
}

// Mode A: the server chunks and embeds. This message SELECTS among what the
// schema pinned; it does not define chunking. Any field that would change
// the collection's plan_digest is FAILED_PRECONDITION.
message ServerChunking {
  // Dotted proto path inside `payload` holding the text to chunk. Empty =
  // the field the pinned descriptor marks derivable (Representation.derive),
  // which is the recommended form. Non-empty is a backfill override,
  // validated against the pinned descriptor.
  string text_field_path = 1;
  // Selects among the pinned specs when a collection declares several
  // derivable representations. Empty = the only one.
  string representation = 2;
}

// Mode B: the client supplies chunks.
message SuppliedChunks {
  // Chunk order defines `ordinal` when every Chunk.ordinal is 0. Mixing
  // explicit and implicit ordinals is INVALID_ARGUMENT.
  repeated Chunk chunks = 1;
  // True: chunks with no vector are embedded server-side with the pinned
  // model. False (default): an unset vector is INVALID_ARGUMENT -- silence
  // would index a chunk that can never match a vector query.
  bool embed_missing_vectors = 2;
}

// A single document to index. Indexing is upsert-by-id: an existing
// document with the same doc_id is replaced atomically.
message IndexDocument {
  // Client-assigned sequence number, strictly increasing per stream.
  // Acks and flow control are correlated by this value; it also counts
  // against the flow-control credit window.
  uint64 client_seq = 1;
  // Target collection; empty = BulkOptions.collection.
  string collection = 2;
  // Document id; empty = server-assigned (returned in DocAck.doc_id).
  string doc_id = 3;
  // Typed field values; names and types must match the collection schema.
  // This is the primary ingest form: schema-as-proto users send it via
  // the generated flattening converters (see docs/rfc/SCHEMA_AS_PROTO.md).
  repeated DocumentField fields = 4;
  // Convenience ingest for schema-as-proto collections: the document as
  // the collection's registered root message, packed in an Any. The server
  // unpacks it reflectively (DynamicMessage) against the registered
  // descriptor set -- measurably slower than `fields`; do not use for bulk
  // loads. Exactly one of `fields` / `typed_document` may be set.
  google.protobuf.Any typed_document = 5;
}

// Requests a durability checkpoint: the server replies with a FlushAck
// once every document with client_seq <= this frame's client_seq is
// durable (committed to the Lucene index).
message FlushMarker {
  uint64 client_seq = 1;
}

// One server->client frame of a BulkIndex stream.
message BulkIndexResponse {
  oneof frame {
    DocAck ack = 1;
    FlowControl flow_control = 2;
    FlushAck flush_ack = 3;
    // Terminal ack for one IndexParentDocument. Exactly one per parent.
    ParentAck parent_ack = 4;
  }
}

// Per-parent acknowledgement, terminal for that client_seq. All-or-nothing:
// status is OK only when every BlockAck is OK. On partial failure the server
// compensates (deletes the blocks that landed) and reports ABORTED; if
// compensation itself fails, DATA_LOSS with the shards named.
//
// ParentAck and DocAck frames interleave freely and may arrive out of order;
// correlate by client_seq only.
message ParentAck {
  uint64 client_seq = 1;
  string doc_id = 2;
  // Generation actually written.
  uint64 generation = 3;
  // Chunks written across all shards. In mode A the client did not choose it.
  int32 chunk_count = 4;
  // One entry per shard TOUCHED -- both shards that received a block and
  // shards that only had older generations purged.
  repeated BlockAck blocks = 5;
  google.rpc.Status status = 6;
  // What the parent cost: one document credit and this many chunk credits.
  uint32 chunk_credits_consumed = 7;
  // The pin the server projected with.
  SchemaPin resolved_schema = 8;
}

message BlockAck {
  int32 shard_id = 1;
  // Chunks in the block written to this shard. 0 for a purge-only shard.
  int32 chunk_count = 2;
  // Documents removed while replacing older generations.
  int32 purged_docs = 3;
  google.rpc.Status status = 4;
}

// Per-document acknowledgement. OK status means the document was accepted
// and routed (visible after the next flush, durable after FlushAck).
message DocAck {
  // Echo of IndexDocument.client_seq.
  uint64 client_seq = 1;
  // Effective document id (echoed, or server-assigned).
  string doc_id = 2;
  // Shard that received the document.
  int32 shard_id = 3;
  // OK, or the reason this document was rejected (schema mismatch, wrong
  // vector dims, unknown collection, ...). Non-OK acks do not end the
  // stream.
  google.rpc.Status status = 4;
}

// Credit-based backpressure signal, tied to flush/merge pressure.
// The client may have at most `window` un-acked documents in flight; each
// DocAck returns one credit. A new FlowControl frame replaces the window.
message FlowControl {
  enum State {
    STATE_UNSPECIFIED = 0;
    // Accepting at full rate.
    STATE_READY = 1;
    // Flush/merge backlog building; window has been reduced.
    STATE_THROTTLED = 2;
    // Stop sending documents until the next FlowControl frame. FlushMarker
    // frames are still allowed.
    STATE_PAUSED = 3;
  }
  State state = 1;
  // Max un-acked documents the client may have in flight from now on.
  // 0 when state is STATE_PAUSED.
  uint32 window = 2;
  // Human-readable cause, e.g. "merge backlog on shard 3".
  string detail = 3;
  // Max un-acked CHUNKS in flight, across IndexDocument and
  // IndexParentDocument frames. 0 = not enforced. Without this a
  // 1000-document window admits millions of chunk writes.
  uint32 chunk_window = 4;
}

// Durability confirmation for a FlushMarker.
message FlushAck {
  // Every document with client_seq <= through_seq is durable.
  uint64 through_seq = 1;
}

message GetDocumentRequest {
  string collection = 1;
  string doc_id = 2;
  // Stored fields to return. Empty = all stored fields.
  repeated string fields = 3;
  // Also return the parent's chunks (document-centric collections only).
  bool include_chunks = 4;
}

message GetDocumentResponse {
  bool found = 1;
  string doc_id = 2;
  repeated DocumentField fields = 3;
  // The stored parent payload re-packed in an Any, when one was indexed via
  // IndexParentDocument (document-centric collections).
  google.protobuf.Any typed_document = 4;
  // Populated when include_chunks was set.
  repeated Chunk chunks = 5;
}

message DeleteDocumentRequest {
  string collection = 1;
  string doc_id = 2;
}

message DeleteDocumentResponse {
  // False when no document with that id existed.
  bool found = 1;
}

message DeleteParentDocumentRequest {
  string collection = 1;
  string doc_id = 2;
  // Restrict fan-out. Empty = every shard (the safe default, and the only
  // correct choice without a ParentAck in hand).
  repeated int32 shards = 3;
  // Delete only generations strictly below this. 0 = all generations.
  uint64 below_generation = 4;
}

message DeleteParentDocumentResponse {
  // Shards on which at least one document was removed.
  int32 blocks_deleted = 1;
  repeated BlockAck blocks = 2;
}
