plugins {
    id 'java'
    id 'io.quarkus'
}

repositories {
    mavenLocal()
    // The ai.pipestream fork snapshots (shared-floor Lucene, preview OpenNLP) resolve from
    // Central's snapshot repository, which every runner can reach; the ai.pipestream registry
    // stays as a fallback. Both are scoped to the forks: without the filter, every dependency
    // would be looked up on a host some runners cannot reach, and a slow or unreachable host
    // would fail resolution at configuration time.
    maven {
        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
        content {
            includeModuleByRegex('ai\\.pipestream', '(lucene|opennlp)(-.*)?')
        }
    }
    maven {
        url = uri('https://git.rokkon.com/api/packages/ai-pipestream/maven')
        content {
            includeModuleByRegex('ai\\.pipestream', '(lucene|opennlp)(-.*)?')
        }
    }
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation libs.scalecube.cluster
    implementation libs.scalecube.transport.netty
    implementation libs.stork.core
    annotationProcessor libs.stork.configuration.generator
    implementation 'io.quarkus:quarkus-rest-client-jackson'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-grpc'
    implementation 'io.quarkus:quarkus-smallrye-stork'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-scheduler'
    implementation 'io.quarkus:quarkus-micrometer'
    // The shared-floor API lives on the companion Lucene branch, so these artifacts cannot
    // come from Maven Central releases yet. Default: resolve the ai.pipestream fork snapshots
    // as module dependencies from the repositories above, so a fresh clone builds with no
    // local setup. Local-build overrides are all-or-nothing: luceneJar, or luceneCoreJarDir +
    // luceneSandboxJarDir + luceneModuleJarDirs as Gradle properties or LUCENE_* environment
    // variables.
    def luceneForkVersion = '11.0.0-experimental-SNAPSHOT'
    def luceneJar = project.findProperty('luceneJar')
    def luceneCoreJarDir = project.findProperty('luceneCoreJarDir')
            ?: project.findProperty('luceneJarDir')
            ?: System.getenv('LUCENE_CORE_JAR_DIR')
    def luceneSandboxJarDir = project.findProperty('luceneSandboxJarDir')
            ?: System.getenv('LUCENE_SANDBOX_JAR_DIR')
    def luceneModuleJarDirsValue = project.findProperty('luceneModuleJarDirs')
            ?: System.getenv('LUCENE_MODULE_JAR_DIRS')
    if (luceneJar != null) {
        implementation files(luceneJar)
    } else if (luceneCoreJarDir != null || luceneSandboxJarDir != null || luceneModuleJarDirsValue != null) {
        if (luceneCoreJarDir == null || luceneSandboxJarDir == null || luceneModuleJarDirsValue == null) {
            throw new GradleException('Local Lucene overrides are all-or-nothing: set luceneCoreJarDir, '
                    + 'luceneSandboxJarDir, and luceneModuleJarDirs (properties or LUCENE_* environment '
                    + 'variables) together, or unset all three to resolve the fork snapshots as modules.')
        }
        implementation fileTree(dir: luceneCoreJarDir, include: '*.jar', exclude: ['*-sources.jar', '*-javadoc.jar'])
        implementation fileTree(dir: luceneSandboxJarDir, include: '*.jar', exclude: ['*-sources.jar', '*-javadoc.jar'])
        luceneModuleJarDirsValue.split(',').each { moduleDir ->
            implementation fileTree(dir: moduleDir, include: '*.jar', exclude: ['*-sources.jar', '*-javadoc.jar'])
        }
    } else {
        implementation "ai.pipestream:lucene-core:${luceneForkVersion}"
        implementation "ai.pipestream:lucene-sandbox:${luceneForkVersion}"
        implementation "ai.pipestream:lucene-analysis-common:${luceneForkVersion}"
        implementation "ai.pipestream:lucene-queryparser:${luceneForkVersion}"
    }
    // Rerank SPI for the coordinator rerank head. The sibling plain-Java
    // embeddings build is wired as a composite (see settings.gradle); the
    // tei-provider jar puts a real RerankProvider on the runtime classpath
    // for ServiceLoader discovery.
    implementation 'ai.pipestream.search:embeddings-spi'
    runtimeOnly 'ai.pipestream.search:tei-provider'
    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation 'io.rest-assured:rest-assured'
}

group = 'ai.pipestream.search'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

// Lucene needs vector API and native access for optimal HNSW performance
def luceneJvmArgs = [
    '--add-modules', 'jdk.incubator.vector',
    '--enable-native-access=ALL-UNNAMED'
]

test {
    jvmArgs luceneJvmArgs
}

quarkusDev {
    jvmArgs = luceneJvmArgs
}
