# Compile-and-unit-test gate: proves a fresh clone builds with no local setup.
# The ai.pipestream fork snapshots (shared-floor Lucene, preview OpenNLP) resolve
# from Central's snapshot repository, which hosted runners can reach; no Lucene
# checkout, local publish, or LUCENE_* environment is required.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # The embeddings build has no wrapper of its own; knn-node's wrapper drives it.
      - name: Build the embeddings modules
        working-directory: embeddings
        run: ../knn-node/gradlew build --no-daemon --console=plain

      - name: Compile knn-node
        working-directory: knn-node
        run: ./gradlew compileJava --no-daemon --console=plain

      # Plain JUnit only: the @QuarkusTest suites boot the full app and stay out of CI.
      - name: Run the plain-JUnit tests
        working-directory: knn-node
        run: >
          ./gradlew :test
          --tests 'ai.pipestream.search.node.RerankStageTest'
          --tests 'ai.pipestream.search.node.ShardKDerivationTest'
          --tests 'ai.pipestream.search.query.HybridExecutorTest'
          --tests 'ai.pipestream.search.query.QueryCompilerTest'
          --no-daemon --console=plain
