// Plain-Java embedding modules: SPI, providers, and the equivalence harness.
// Deliberately framework-free (no Quarkus/CDI); knn-node or any other host
// wires these in as plain jars. ai.pipestream snapshots (preview OpenNLP)
// resolve from Central's snapshot repository, with the ai.pipestream
// registry as fallback (see docs/INTEGRATION_PLAN.md §2).
subprojects {
  apply plugin: 'java-library'

  // Coordinates so composite-build consumers (knn-node) can substitute module
  // dependencies like 'ai.pipestream.search:embeddings-spi'.
  group = 'ai.pipestream.search'
  version = '1.0.0-SNAPSHOT'

  java {
    // Compiled with the current JDK, targeting 21 (Lucene 11 baseline).
  }

  tasks.withType(JavaCompile).configureEach {
    options.release = 21
  }

  repositories {
    mavenLocal()
    // Central's snapshot repository first (reachable from any runner), the ai.pipestream
    // registry as fallback; both scoped to the fork so other artifacts never query a host
    // some runners cannot reach.
    maven {
      url = uri('https://central.sonatype.com/repository/maven-snapshots/')
      content { includeModuleByRegex('ai\\.pipestream', 'opennlp(-.*)?') }
    }
    maven {
      url = uri('https://git.rokkon.com/api/packages/ai-pipestream/maven')
      content { includeModuleByRegex('ai\\.pipestream', 'opennlp(-.*)?') }
    }
    mavenCentral()
  }

  configurations.configureEach {
    // The OpenNLP preview snapshots move under this build; a restored CI
    // cache plus Gradle's default 24h snapshot TTL would serve yesterday's
    // jars. Always re-check changing modules (cheap metadata HEADs).
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
  }

  dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  }

  test {
    useJUnitPlatform()
  }
}
